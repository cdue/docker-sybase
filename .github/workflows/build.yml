name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sybase .

      - name: List images
        run: docker images

      - name: Start container
        run: docker run -d -p 5000:5000 -p 5001:5001 --name my-sybase sybase

      - name: Wait for ASE initialization
        run: |
          for i in $(seq 1 60); do
            if docker logs my-sybase 2>&1 | grep -q "SYBASE INITIALIZED"; then
              echo "Sybase initialized"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for SYBASE INITIALIZED"
          exit 1

      - name: Show running processes
        run: docker exec my-sybase ps -ef

      - name: Container logs
        if: always()
        run: docker logs my-sybase

      - name: Stop container
        if: always()
        run: docker stop my-sybase || true
