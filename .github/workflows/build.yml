name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        env:
          ASE_SUITE_URL: ${{ vars.ASE_SUITE_URL }}
        run: |
          if [ -n "$ASE_SUITE_URL" ]; then
            docker build --build-arg "ASE_SUITE_URL=$ASE_SUITE_URL" -t sybase .
          else
            docker build -t sybase .
          fi

      - name: List images
        run: docker images

      - name: Start container
        run: docker run -d -p 5000:5000 -p 5001:5001 --name my-sybase sybase

      - name: Wait for ASE initialization
        run: |
          for i in $(seq 1 60); do
            if docker logs my-sybase 2>&1 | grep -q "SYBASE INITIALIZED"; then
              echo "Sybase initialized"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for SYBASE INITIALIZED"
          exit 1

      - name: Show running processes
        run: docker exec my-sybase ps -ef

      - name: Compute Docker Hub tag
        id: tag
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_IMAGE != ''
        run: |
          branch="${GITHUB_REF_NAME}"
          case "$branch" in
            main|master) tag="latest" ;;
            *)           tag="$(echo "$branch" | tr '/' '-')" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_IMAGE != ''
        run: |
          docker tag sybase "${{ vars.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}"
          docker push "${{ vars.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}"

      - name: Container logs
        if: always()
        run: docker logs my-sybase

      - name: Stop container
        if: always()
        run: docker stop my-sybase || true
